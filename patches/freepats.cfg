# Minimal General MIDI patch set embedded in the libmidi filter.
#
# Deliberately reduced from the full freepats set (https://freepats.zenvoid.org/,
# ~32MB) to just the instruments used by test_signals/midi/test.mid, so the
# whole set can be embedded directly into the libmidi_1.wasm module without
# hitting Emscripten's dynamic-linker limit on a side module's static data
# segment size (large --embed-file payloads made `dlopen()` of this module
# abort with "failure to getMemory - memory growth ... is not supported
# there", independent of the main module's INITIAL_MEMORY).
#
# To render other MIDI files with different instrumentation, replace this
# directory with a fuller GM patch set (e.g. the complete freepats Tone_000/
# Drum_000 trees) and rebuild - the reframer/decoder code needs no changes,
# only more patches need to be embedded.

bank 0

68 Tone_000/068_Oboe.pat
70 Tone_000/070_Bassoon.pat
71 Tone_000/071_Clarinet.pat
72 Tone_000/072_Piccolo.pat
